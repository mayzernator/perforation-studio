<title>Perforation Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: tool shell. Header strip with presets, plate/holes toggle and export; control column left; live sheet preview right with a fixed-height stats rail and floating, dismissible warnings above it. */
:root{
  --bg:#e6e9ed; --surface:#f6f7f9; --ink:#15191e; --muted:#5b6571; --line:#cfd5dc;
  --accent:#1e48c8; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --sheet:#b8c0c9; --sheet-edge:#7c8794; --hole:#f6f7f9; --other:#8a94a0;
  --warn:#9a5600; --warn-soft:#fbf0e0; --bad:#b3332a; --bad-soft:#fbe6e4; --ok:#2c7448;
  --shadow:0 6px 24px rgba(20,25,30,.16);
  --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --surface:#181c21; --ink:#e3e7ec; --muted:#8c96a2; --line:#2a3138;
    --accent:#7896ff; --accent-ink:#0b1020; --accent-soft:#1d2645;
    --sheet:#59636d; --sheet-edge:#8f9aa6; --hole:#181c21; --other:#76818d;
    --warn:#e0a24a; --warn-soft:#2c2416; --bad:#ff7b6e; --bad-soft:#331c1a; --ok:#6fcf93;
    --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181c21; --ink:#e3e7ec; --muted:#8c96a2; --line:#2a3138;
  --accent:#7896ff; --accent-ink:#0b1020; --accent-soft:#1d2645;
  --sheet:#59636d; --sheet-edge:#8f9aa6; --hole:#181c21; --other:#76818d;
  --warn:#e0a24a; --warn-soft:#2c2416; --bad:#ff7b6e; --bad-soft:#331c1a; --ok:#6fcf93;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.35}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.main{display:grid;grid-template-columns:304px minmax(0,1fr);gap:12px;min-height:0}
aside{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:0}
.grp{padding:12px 14px 14px;border-bottom:1px solid var(--line);display:grid;gap:11px}
.grp:last-child{border-bottom:0}
.grp h2{font-family:var(--f-display);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:5px 10px;align-items:center}
.ctl > label{grid-column:1/-1;font-size:13px;font-weight:500}
.lh{grid-column:1/-1;display:flex;align-items:baseline;gap:2px;min-width:0}
.nm{border:0;background:none;padding:0;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;text-align:left;white-space:normal;border-radius:3px}
.nm:hover{color:var(--accent)}
.nm.mod{text-decoration:underline dotted var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px}
.cu{margin-left:auto;border:0;background:none;padding:0 3px;color:var(--muted);font-size:15px;line-height:1;flex:none}
.cu:hover{color:var(--accent)}
.ctl.chk{grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.ctl.chk .lh{grid-column:auto}
.ctl.sel{grid-template-columns:1fr}
.unit{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:4px;font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
input[type=number],select{width:100%;font:500 12.5px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-variant-numeric:tabular-nums}
select{font-family:var(--f-body);font-size:13.5px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
input[type=file]{font-size:12.5px;max-width:100%;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
button{font:600 13px var(--f-body);border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--sheet-edge)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools select{width:auto;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg button:disabled{opacity:.45;cursor:default}
.hist button{color:var(--ink)}

/* gradient controller list */
.glist{display:grid;gap:6px}
.grow{display:flex;gap:6px;align-items:stretch}
.gsel{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:var(--bg);font-weight:500;padding:6px 9px}
.gsel[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gnum{font:600 11px var(--f-mono);width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;background:var(--other);color:var(--surface);flex:none}
.gsel[aria-pressed="true"] .gnum{background:var(--accent);color:var(--accent-ink)}
.gsel small{margin-left:auto;color:var(--muted);font:400 11px var(--f-mono);overflow:hidden;text-overflow:ellipsis}
.gx{padding:0 10px;color:var(--muted);font-size:16px;line-height:1;background:var(--bg)}
.gx:hover{color:var(--bad)}
.gadd{display:flex;gap:6px}
.gadd button{flex:1;padding:6px 6px;font-size:12.5px}
.gedit{display:grid;gap:11px;padding:11px 11px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.gedit input[type=number],.gedit select{background:var(--surface)}
.gedit .ttl{font-size:12px;color:var(--muted);margin:0;font-weight:500}

.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cwrap{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cbar{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.viewseg{pointer-events:auto}
.viewseg button{padding:3px 12px;font-size:12px}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c3d:active{cursor:grabbing}
.snapbtn{pointer-events:auto;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;color:var(--muted)}
.snapbtn[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft);border-color:var(--accent)}
/* floating warnings: overlay the canvas, never resize it */
.alerts{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.alert{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;max-width:min(560px,100%);padding:9px 8px 9px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:13px;line-height:1.4}
.alert::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--warn)}
.alert.bad::before{background:var(--bad)}
.alert.w{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft)}
.alert span{flex:1;min-width:0}
.alert button{border:0;background:transparent;color:var(--muted);padding:0 6px;font-size:17px;line-height:1.1}
.alert button:hover{color:var(--ink)}
.stats{display:flex;gap:6px 22px;padding:10px 14px;border-top:1px solid var(--line);font:12px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto}
.stat span{color:var(--muted);margin-right:6px;font-family:var(--f-body);font-size:12.5px}
.stat b{font-weight:500}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;max-width:min(92vw,520px);z-index:20}
/* Mac app: header doubles as the title bar */
.is-app .app{padding-top:10px}
.is-app header{-webkit-app-region:drag;padding-left:70px;min-height:34px}
.is-app header button,.is-app header select,.is-app header .seg{-webkit-app-region:no-drag}
.is-app .brand h1{font-size:18px}
.docname{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.docname b{font-weight:500;color:var(--ink)}
@media (max-width:780px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:64vh;min-height:360px;order:-1}
  .brand span{display:none}
  aside{overflow:visible}
  .tools{width:100%}
  .tools select{flex:1 1 100%;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>Perforation Studio</h1><span id="tagline">Parametric vent, grille and halftone patterns in millimetres</span><span class="docname" id="docName" hidden></span></div>
    <div class="tools">
      <select id="preset" aria-label="Preset"></select>
      <div class="seg" role="group" aria-label="Export as"><button id="mPlate" aria-pressed="true">Plate with holes</button><button id="mHoles" aria-pressed="false">Holes only</button></div>
      <div class="seg hist" role="group" aria-label="History"><button id="bUndo" title="Undo (Ctrl or ⌘ + Z)">↶ Undo</button><button id="bRedo" title="Redo (Shift + Ctrl or ⌘ + Z)">↷ Redo</button></div>
      <button id="bDXF" class="primary">Export DXF</button>
      <button id="bSVG">Export SVG</button>
      <button id="bCopy">Copy DXF</button>
    </div>
  </header>
  <div class="main">
    <aside id="side"></aside>
    <div class="stage">
      <div class="cwrap" id="cwrap">
        <canvas id="cv" aria-label="Pattern preview"></canvas>
        <canvas id="c3d" aria-label="3D preview of the wrapped part" hidden></canvas>
        <div class="cbar">
          <div class="seg viewseg" id="viewSeg" role="group" aria-label="View" hidden><button id="vFlat" aria-pressed="true">Flat</button><button id="v3d" aria-pressed="false">3D</button></div>
          <button class="snapbtn" id="snapBtn" aria-pressed="true" title="Snap handles to the panel centre, edges, other controllers, and horizontal or vertical. Hold Shift to step angles by 15°.">Snap on</button>
          <div class="chip" id="chip"></div>
        </div>
        <div class="alerts" id="alerts" aria-live="polite"></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>/*CORE*/</script>
<script>/*PRESETS*/</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const {DEF,PRESETS}=PerfPresets, Core=PerfCore;
const clone=o=>JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')?undefined:v));
let S=clone(DEF), RES=null, active=0, snapOn=true, guides=[];
const APP=window.perfApp||null;
let onHist=()=>{};
if(APP) document.documentElement.classList.add('is-app');

const OPT={
  boundary:[['rect','Rectangle'],['rounded','Rounded rectangle'],['circle','Circle'],['ellipse','Ellipse']],
  layout:[['grid','Square grid'],['hex','Hex stagger'],['random','Random scatter'],['fibonacci','Sunflower (Fibonacci)'],['concentric','Concentric rings'],['spiral','Spiral']],
  shape:[['circle','Circle'],['hexagon','Hexagon'],['square','Square'],['triangle','Triangle'],['diamond','Diamond'],['slot','Slot']],
  ease:[['linear','Linear'],['smooth','Smooth'],['in','Ease in'],['out','Ease out']],
  blend:[['max','Max (strongest wins)'],['add','Add'],['average','Average'],['multiply','Multiply'],['min','Min (weakest wins)']],
  jitMode:[['all','Everywhere'],['mid','In the transition band'],['high','Where holes are large'],['low','Where holes are small']],
  gtype:[['radial','Radial point'],['linear','Linear'],['image','Image brightness']],
  wrapShape:[['cyl','Cylinder'],['cone','Cone or frustum']],
};
const hasG=()=>S.grads.length>0;
const ranged=()=>hasG()||S.jit>0;
const TYPE_NAME={radial:'Radial',linear:'Linear',image:'Image'};

const SECTIONS=[
 {t:'Panel',items:[
  {k:'wrap',type:'check',label:'Wrap around a cylinder (left and right edges join seamlessly)'},
  {k:'wrapShape',type:'select',label:'Part shape',show:()=>S.wrap},
  {k:'cylD',label:'Cylinder diameter',min:5,max:400,step:0.5,u:'mm',show:()=>S.wrap&&S.wrapShape!=='cone',tip:'Diameter of the surface the pattern is applied to'},
  {k:'d1',label:'Bottom diameter',min:0,max:600,step:0.5,u:'mm',show:()=>S.wrap&&S.wrapShape==='cone'},
  {k:'d2',label:'Top diameter',min:0,max:600,step:0.5,u:'mm',show:()=>S.wrap&&S.wrapShape==='cone',tip:'Set to 0 for a pointed cone'},
  {k:'axH',label:'Height (along the axis)',min:2,max:600,step:0.5,u:'mm',show:()=>S.wrap&&S.wrapShape==='cone'},
  {k:'boundary',type:'select',label:'Boundary',show:()=>!S.wrap},
  {k:'W',label:()=>S.boundary==='circle'?'Diameter':'Width',min:10,max:600,step:0.5,u:'mm',show:()=>!S.wrap},
  {k:'H',label:()=>S.wrap?'Height (along the cylinder)':'Height',min:10,max:600,step:0.5,u:'mm',show:()=>S.wrap?S.wrapShape!=='cone':S.boundary!=='circle'},
  {k:'corner',label:'Corner radius',min:0,max:100,step:0.5,u:'mm',show:()=>!S.wrap&&S.boundary==='rounded'},
  {k:'margin',label:()=>S.wrap?'Top and bottom margin':'Edge margin',min:0,max:50,step:0.5,u:'mm'},
  {k:'_wh',type:'hint',show:()=>S.wrap,text:()=>wrapHint()},
  {k:'thick',label:'Sheet thickness',min:0.2,max:10,step:0.1,u:'mm',tip:'Used for the manufacturability checks only'},
 ]},
 {t:'Layout',items:[
  {k:'layout',type:'select',label:'Layout'},
  {k:'pitch',label:()=>S.adaptive?'Pitch where holes are smallest':'Pitch (centre to centre)',min:0.8,max:50,step:0.1,u:'mm'},
  {k:'adaptive',type:'check',label:'Spread out larger holes so they never collide'},
  {k:'webMin',label:'Minimum web between holes',min:0,max:10,step:0.1,u:'mm',show:()=>S.adaptive,tip:'Material left between neighbouring holes. Larger holes skip neighbours to keep at least this much.'},
  {k:'rowF',label:'Row spacing',min:0.3,max:6,step:0.05,u:'×',show:()=>!['random','fibonacci'].includes(S.layout)},
  {k:'angle',label:'Lattice angle',min:-90,max:90,step:1,u:'°',show:()=>!S.wrap&&['grid','hex'].includes(S.layout)},
  {k:'twist',label:'Helix twist',min:-75,max:75,step:1,u:'°',show:()=>S.wrap&&['grid','hex'].includes(S.layout),tip:'Shifts each row so the lattice spirals around the part. It always closes at the seam.'},
  {k:'seed',label:'Layout seed',min:1,max:999,step:1,u:'',show:()=>S.layout==='random'},
 ]},
 {t:'Holes',items:[
  {k:'shape',type:'select',label:'Shape'},
  {k:'sMin',label:'Smallest size',min:0,max:40,step:0.1,u:'mm',show:ranged},
  {k:'sMax',label:()=>ranged()?'Largest size':'Size',min:0.2,max:40,step:0.1,u:'mm'},
  {k:'elong',label:'Length ÷ width',min:1,max:12,step:0.1,u:'×',show:()=>['slot','diamond'].includes(S.shape)},
  {k:'rot',label:'Rotation',min:-180,max:180,step:1,u:'°',show:()=>S.shape!=='circle'},
  {k:'rotGrad',label:'Extra rotation from gradient',min:-180,max:180,step:1,u:'°',show:()=>S.shape!=='circle'&&hasG()},
  {k:'alignRadial',type:'check',label:'Point holes away from centre',show:()=>S.shape!=='circle'&&!S.wrap},
  {k:'steps',label:'Size steps (0 = continuous)',min:0,max:12,step:1,u:'',show:ranged,tip:'Snap to a few sizes, e.g. the drill bits you own'},
  {k:'dropBelow',label:'Skip holes smaller than',min:0,max:10,step:0.1,u:'mm',show:ranged},
 ]},
 {t:'Gradients',custom:true},
 {t:'Random variation',items:[
  {k:'jit',label:'Size variation',min:0,max:100,step:1,u:'%',tip:'Percent of the smallest-to-largest range each hole can shift'},
  {k:'jitMode',type:'select',label:'Apply variation',show:()=>hasG()&&S.jit>0},
  {k:'rotJit',label:'Rotation variation',min:0,max:180,step:1,u:'± °',show:()=>S.shape!=='circle'},
  {k:'jitSeed',label:'Variation seed',min:1,max:999,step:1,u:'',show:()=>S.jit>0||S.rotJit>0},
  {k:'_jh',type:'hint',text:()=>!hasG()?'With no gradients, sizes scatter between the smallest and largest size.':S.jitMode==='mid'?'Variation is strongest halfway along the gradient and fades out at both ends.':'Each hole keeps its random value while you drag controllers. Change the seed for a new mix.',show:()=>S.jit>0},
 ]},
 {t:'Export',items:[
  {k:'_mode',type:'hint',text:()=>S.out==='holes'?'Holes only: every hole is its own closed profile and the plate outline is left out, so each one extrudes as a separate body.':'Plate with holes: the outline plus every hole, ready to cut or extrude as one perforated plate.'},
  {k:'_ex',type:'hint',text:()=>(S.wrap?'Wrapped: the export is the flat development (circumference × height). Use Wrap or Emboss in Fusion, SolidWorks or Onshape to put it on the cylinder. ':'')+'DXF R12, millimetres, origin at the bottom-left corner of the panel, so holes-only and plate exports line up. Holes on layer HOLES, outline on layer OUTLINE. Circles export as true circles and slots keep real arcs.'},
 ]},
];

// ---------- history: global undo/redo, per-control reset and undo ----------
let gid=0;
const imgs={};
function ensureIds(){ S.grads.forEach(g=>{ if(!g.id) g.id='g'+(++gid); }); }
const snapStr=()=>JSON.stringify(S,(k,v)=>k.startsWith('_')?undefined:v);
let hist=[], hidx=-1, base={}, gbase={}, cursor=null;
function setBaseline(){ ensureIds(); base=JSON.parse(snapStr()); gbase={}; S.grads.forEach(g=>{gbase[g.id]=clone(g);}); }
function commit(){
  ensureIds(); const s=snapStr();
  if(hidx>=0&&hist[hidx].s===s) return;
  hist=hist.slice(0,hidx+1); hist.push({s,o:JSON.parse(s),base,gbase});
  if(hist.length>400){ hist.shift(); }
  hidx=hist.length-1; cursor=null; updUndo(); syncControls(); onHist();
}
function restore(o){
  S=clone(o); S.grads.forEach(g=>{ if(imgs[g.id]) g._img=imgs[g.id]; });
  modeUI(); renderGrad(); syncControls(); schedule(); custom();
}
function undo(){ if(hidx>0){ hidx--; cursor=null; base=hist[hidx].base; gbase=hist[hidx].gbase; restore(hist[hidx].o); updUndo(); onHist(); } }
function redo(){ if(hidx<hist.length-1){ hidx++; cursor=null; base=hist[hidx].base; gbase=hist[hidx].gbase; restore(hist[hidx].o); updUndo(); onHist(); } }
function updUndo(){ $('#bUndo').disabled=hidx<=0; $('#bRedo').disabled=hidx>=hist.length-1; }
function keyGet(o,key){
  if(key.startsWith('g:')){ const [,id,f]=key.split(':'); const g=(o.grads||[]).find(x=>x.id===id); return g?g[f]:undefined; }
  return o[key];
}
function keySet(key,v){
  if(key.startsWith('g:')){
    const [,id,f]=key.split(':'), g=S.grads.find(x=>x.id===id); if(!g) return;
    if(f==='type') changeType(g,v); else g[f]=v;
    renderGrad();
  } else set(key,v);
  syncControls(); schedule(); custom();
}
function defOf(key){
  if(key.startsWith('g:')){ const [,id,f]=key.split(':'); return gbase[id]?gbase[id][f]:undefined; }
  return key in base?base[key]:DEF[key];
}
// newest earlier value of this one setting that differs from what it is now
function prevIdx(key){
  const cur=keyGet(S,key);
  for(let j=(cursor&&cursor.key===key?cursor.from-1:hidx); j>=0; j--){
    const v=keyGet(hist[j].o,key);
    if(v===undefined) return -1;
    if(v!==cur) return j;
  }
  return -1;
}
function ctlUndo(key){
  const j=prevIdx(key); if(j<0) return;
  keySet(key,keyGet(hist[j].o,key)); commit();
  cursor={key,from:j}; syncControls();
}
function resetKey(key){

let radRef=null;
function changeType(g,v){
  const keep={id:g.id,invert:g.invert,w:g.w}, fresh=newCtrl(v);
  Object.keys(g).forEach(k=>delete g[k]); Object.assign(g,fresh,keep);

function updSummary(){ gradBox&&gradBox.querySelectorAll('.gsel small').forEach(sm=>{ const g=S.grads[+sm.dataset.i]; if(g) sm.textContent=gSummary(g); }); }

// ---------- image controller ----------
function loadImage(g,file){
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{g._img=im; imgs[g.id]=im; g._sampler=null; renderGrad(); schedule(); toast('Image loaded. Dark areas now open larger holes.');};

function makeSampler(im,W,H){
  const ar=W/H, M=360; let cw,ch;
  if(ar>=1){cw=M;ch=Math.max(1,Math.round(M/ar));}else{ch=M;cw=Math.max(1,Math.round(M*ar));}
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d');
  const s=Math.max(cw/im.width,ch/im.height), dw=im.width*s, dh=im.height*s;
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch); x.drawImage(im,(cw-dw)/2,(ch-dh)/2,dw,dh);
  const d=x.getImageData(0,0,cw,ch).data, L=new Float32Array(cw*ch);
  for(let i=0;i<L.length;i++) L[i]=1-(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255;
  return {sample(u,v){const xi=Math.min(cw-1,Math.max(0,Math.floor(u*cw))), yi=Math.min(ch-1,Math.max(0,Math.floor(v*ch))); return L[yi*cw+xi];}};
}

// ---------- compute + draw ----------
let raf=0;
function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; run();}); }
function run(){
  Core.normalize(S);
  const a=S.W/S.H;
  S.grads.forEach(g=>{ if(g.type==='image'&&g._img&&(!g._sampler||g._aspect!==a)){ g._sampler=makeSampler(g._img,S.W,S.H); g._aspect=a; } });
  RES=Core.compute(S);
  draw(); renderStats(); renderAlerts(); updSummary(); if(S.wrap) syncControls();
  if(view3d){ if(!S.wrap) setView(false); else build3D(); }
}
const cv=$('#cv'), ctx=cv.getContext('2d'); let view={sc:1,ox:0,oy:0};
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toScreen=(x,y)=>[view.ox+x*view.sc, view.oy+(S.H-y)*view.sc];
const toModel=(X,Y)=>[(X-view.ox)/view.sc, S.H-(Y-view.oy)/view.sc];
const UV=(u,v)=>{ if(S.wrap&&!S._dev) Core.normalize(S); return Core.uvToXY(S,u,v); };
const XYUV=(x,y)=>{ if(S.wrap&&!S._dev) Core.normalize(S); return Core.xyToUV(S,x,y); };
const isCone=()=>!!(S._dev&&S._dev.kind==='cone');
function handlePts(){
  const out=[];
  S.grads.forEach((g,i)=>{
    if(g.type==='radial'){ const c=UV(g.u,g.v); out.push({i,p:'c',m:c}); out.push({i,p:'r',m:[c[0]+g.r,c[1]]}); }
    else if(g.type==='linear'){ out.push({i,p:'a',m:UV(g.au,g.av)}); out.push({i,p:'b',m:UV(g.bu,g.bv)}); }
  });
  return out;
}
function draw(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(!r.width||!r.height) return;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const pad=Math.min(56,Math.max(28,r.width*0.06)), W=S.W, H=S.H;
  const sc=Math.max(0.01,Math.min((r.width-2*pad)/W,(r.height-2*pad-14)/H));
  view={sc,ox:(r.width-W*sc)/2,oy:(r.height-H*sc)/2-7};
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  ctx.setTransform(sc*dpr,0,0,sc*dpr,view.ox*dpr,view.oy*dpr);
  const bd=new Path2D(Core.boundaryD(S)), inv=S.out==='holes';
  if(inv){ ctx.setLineDash([4/sc,4/sc]); ctx.lineWidth=1/sc; ctx.strokeStyle=col('--sheet-edge'); ctx.stroke(bd); ctx.setLineDash([]); }
  else { ctx.fillStyle=col('--sheet'); ctx.fill(bd); ctx.lineWidth=1.2/sc; ctx.strokeStyle=col('--sheet-edge'); ctx.stroke(bd); }
  if(S.wrap&&RES&&!RES.error){
    const hp0=new Path2D(RES.d);
    const dvv=S._dev, cone=dvv.kind==='cone', apx=cone?dvv.ax:0, apy=cone?H-dvv.ay:0;
    [-1,1].forEach(s=>{ ctx.save(); ctx.globalAlpha=.38;
      if(cone){ ctx.translate(apx,apy); ctx.rotate(-s*dvv.phi); ctx.translate(-apx,-apy); } else ctx.translate(s*W,0);
      if(inv){ ctx.fillStyle=col('--sheet'); ctx.fill(hp0); } else { ctx.fillStyle=col('--sheet'); ctx.fill(bd); ctx.fillStyle=col('--hole'); ctx.fill(hp0); }
      ctx.restore(); });
    ctx.save(); ctx.setLineDash([3/sc,3/sc]); ctx.lineWidth=1.2/sc; ctx.strokeStyle=col('--accent');
    if(cone){ [dvv.th0,dvv.th0+dvv.phi].forEach(t=>{ ctx.beginPath(); ctx.moveTo(dvv.ax+dvv.Rt*Math.cos(t),H-(dvv.ay+dvv.Rt*Math.sin(t))); ctx.lineTo(dvv.ax+(dvv.Rb+6/sc)*Math.cos(t),H-(dvv.ay+(dvv.Rb+6/sc)*Math.sin(t))); ctx.stroke(); }); }
    else [0,W].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,-6/sc); ctx.lineTo(x,H+6/sc); ctx.stroke(); });
    ctx.restore();
  }
  if(RES&&!RES.error){
    const hp=new Path2D(RES.d);
    ctx.fillStyle=inv?col('--sheet'):col('--hole'); ctx.fill(hp);
    ctx.lineWidth=0.8/sc; ctx.strokeStyle=col('--sheet-edge'); ctx.stroke(hp);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=col('--muted'); ctx.font='500 12px '+col('--f-mono'); ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(isCone()?`${+W.toFixed(1)} × ${+H.toFixed(1)} mm flat · ${(S._dev.phi*180/Math.PI).toFixed(1)}° sector · wraps Ø ${S.d1} → Ø ${S.d2} × ${S.axH} mm`:S.wrap?`${+W.toFixed(2)} × ${+H.toFixed(2)} mm flat · wraps Ø ${S.cylD} mm`:S.boundary==='circle'?`Ø ${+W.toFixed(2)} mm`:`${+W.toFixed(2)} × ${+H.toFixed(2)} mm`, view.ox+W*sc/2, view.oy+H*sc+10);

  // snap guides
  const acc=col('--accent'), oth=col('--other'), surf=col('--surface'), ink=col('--accent-ink');
  if(guides.length){
    ctx.save(); ctx.strokeStyle=acc; ctx.globalAlpha=.7; ctx.lineWidth=1; ctx.setLineDash([2,4]);
    guides.forEach(g=>{ ctx.beginPath();
      if(isCone()){
        const n=64;
        for(let k=0;k<=n;k++){ const t=-0.15+1.3*k/n, p=g.u!=null?toScreen(...UV(g.u,t)):toScreen(...UV(t,g.v)); k?ctx.lineTo(...p):ctx.moveTo(...p); }
      } else if(g.u!=null){ const X=toScreen(g.u*S.W,0)[0]; ctx.moveTo(X,0); ctx.lineTo(X,r.height); }
      else { const Y=toScreen(0,g.v*S.H)[1]; ctx.moveTo(0,Y); ctx.lineTo(r.width,Y); }
      ctx.stroke(); });
    ctx.restore();
  }
  // controllers: inactive first, selected on top
  const order=S.grads.map((g,i)=>i).sort((a,b)=>(a===active)-(b===active));
  order.forEach(i=>{
    const g=S.grads[i], on=i===active, c=on?acc:oth;
    ctx.save(); if(!on) ctx.globalAlpha=.85;
    ctx.lineWidth=on?1.5:1.2; ctx.strokeStyle=c;
    if(g.type==='radial'){
      const [cx,cy]=toScreen(...UV(g.u,g.v));
      ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(cx,cy,g.r*sc,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      dot(cx+g.r*sc,cy,5,surf,c);
      dot(cx,cy,9,c,surf); label(cx,cy,String(i+1),on?ink:surf);
    } else if(g.type==='linear'){
      const a=toScreen(...UV(g.au,g.av)), b=toScreen(...UV(g.bu,g.bv));
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      const ang=Math.atan2(b[1]-a[1],b[0]-a[0]); ctx.beginPath();
      ctx.moveTo(b[0]-15*Math.cos(ang-0.4),b[1]-15*Math.sin(ang-0.4)); ctx.lineTo(...b); ctx.lineTo(b[0]-15*Math.cos(ang+0.4),b[1]-15*Math.sin(ang+0.4)); ctx.stroke();

    }
    ctx.restore();
  });
  function dot(x,y,rad,fill,stroke){ ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=stroke; ctx.stroke(); }
  function label(x,y,t,c,size){ ctx.fillStyle=c; ctx.font=`700 ${size||10.5}px `+col('--f-mono'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y+0.5); }

  const chip=$('#chip'); const ag=S.grads[active];
  const tip=ag?(ag.type==='radial'?'Drag dots and ring handles':ag.type==='linear'?'Drag A and B. Shift for 15° steps':'Image gradient selected'):'No gradients';
  $('#viewSeg').hidden=!S.wrap;
  if(!view3d) chip.textContent=(inv?'Holes only · outline is reference only · ':'')+(S.wrap?'Faded copies show the next repeat · ':'')+tip;
}

// ---------- stats + floating alerts ----------
function renderStats(){
  const el=$('#stats'); el.textContent='';
  if(!RES||RES.error) return;
  const add=(k,v,cls)=>{const d=document.createElement('div'); d.className='stat'+(cls?' '+cls:''); const s=document.createElement('span'); s.textContent=k; const b=document.createElement('b'); b.textContent=v; d.append(s,b); el.appendChild(d);};
  const n=RES.holes.length, t=S.thick, web=RES.web;
  add('Holes',n.toLocaleString());

  add('Min web',web==null?'n/a':web<0.01?'touching':web.toFixed(2)+' mm',web==null?'':web<0.01?'bad':web<t?'warn':'');
  add('Hole size',!n?'n/a':(RES.sMax-RES.sMin<0.005?RES.sMin.toFixed(2)+' mm':RES.sMin.toFixed(2)+' to '+RES.sMax.toFixed(2)+' mm'),n&&RES.sMin<t?'warn':'');
  if(S.steps>=2&&RES.sizes.length<=12) add('Sizes',RES.sizes.map(s=>s.toFixed(2)).join(', '));
  if(S.wrap){ if(RES.fit&&RES.fit.px) add('Columns',RES.fit.cols+' @ '+RES.fit.px.toFixed(3)+' mm'); if(RES.fit&&RES.fit.rows) add('Rows',RES.fit.rows+' · '+RES.fit.nMin+'–'+RES.fit.nMax+' per row'); add('Split on seam',String(RES.seamSplit)); }
}
const dismissed=new Set();
function currentAlerts(){
  const out=[];
  if(!RES) return out;
  if(RES.error){ out.push({id:'err',cls:'bad',t:RES.error}); return out; }
  const n=RES.holes.length, t=S.thick, web=RES.web;
  if(!n) out.push({id:'none',cls:'w',t:'No holes fit. Reduce the edge margin or the hole size.'});
  if(n&&web!=null&&web<0.01) out.push({id:'touch',cls:'bad',t:'Holes touch or overlap. Increase the pitch or reduce the largest size.'});
  else if(n&&web!=null&&web<t) out.push({id:'web',cls:'w',t:`Web is ${web.toFixed(2)} mm, thinner than the ${t} mm sheet. Laser and punch shops usually want web ≥ thickness.`});
  if(n&&RES.sMin<t) out.push({id:'small',cls:'w',t:`Smallest hole (${RES.sMin.toFixed(2)} mm) is under the sheet thickness, which is hard to cut cleanly in metal.`});
  if(n>15000) out.push({id:'big',cls:'w',t:'Large file. Some CAD tools slow down above about 15,000 entities.'});
  if(S.wrap&&S.grads.some(g=>g.type==='linear'&&Math.abs((g.bu-g.au)*(S._dev?S._dev.Cm:S.W))>0.01)) out.push({id:'seamlin',cls:'w',t:'A linear gradient that does not run straight along the part changes value across the seam, so hole sizes will jump there. Make it vertical (snap helps) or use radial gradients.'});
  if(S.wrap&&S.grads.some(g=>g.type==='image')) out.push({id:'seamimg',cls:'w',t:'Image gradients only wrap cleanly if the image tiles left to right.'});
  if(isCone()&&S.d2===0) out.push({id:'apex',cls:'w',t:'A pointed cone has no top opening. Holes near the tip are dropped because the rows get too short.'});
  if(S.grads.some(g=>g.type==='image'&&!g._img)) out.push({id:'img',cls:'w',t:'An image gradient has no image yet. Choose one in its settings.'});
  return out;
}
function renderAlerts(){
  const box=$('#alerts'), list=currentAlerts();
  // a dismissed alert reappears only after it clears and then comes back
  const ids=new Set(list.map(a=>a.id)); [...dismissed].forEach(id=>{ if(!ids.has(id)) dismissed.delete(id); });
  box.textContent='';
  list.filter(a=>!dismissed.has(a.id)).forEach(a=>{
    const d=document.createElement('div'); d.className='alert '+a.cls; d.setAttribute('role',a.cls==='bad'?'alert':'status');
    const s=document.createElement('span'); s.textContent=a.t;
    const x=document.createElement('button'); x.textContent='×'; x.setAttribute('aria-label','Dismiss'); x.title='Dismiss';
    x.addEventListener('click',()=>{dismissed.add(a.id); renderAlerts();});
    d.append(s,x); box.appendChild(d);
  });
}

// ---------- dragging + snapping ----------
let drag=null;
function hit(X,Y){
  let best=null, bd=16;
  handlePts().forEach(h=>{const [sx,sy]=toScreen(...h.m); let d=Math.hypot(sx-X,sy-Y); if(h.i===active) d-=3; if(d<bd){bd=d;best=h;}});
  return best;
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), X=e.clientX-r.left, Y=e.clientY-r.top;
  let h=hit(X,Y);
  if(!h&&S.grads[active]&&S.grads[active].type==='radial') h={i:active,p:'c'};
  if(!h) return;
  drag={i:h.i,p:h.p};
  if(active!==h.i){active=h.i; renderGrad();}
  cv.setPointerCapture(e.pointerId); move(X,Y,e.shiftKey); e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(), X=e.clientX-r.left, Y=e.clientY-r.top;
  if(drag){ move(X,Y,e.shiftKey); return; }

const endDrag=()=>{ if(drag){drag=null; guides=[]; renderGrad(); draw(); custom(); commit();} };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);

// Snap works in (u, v): u runs around a wrapped part (or across a flat panel), v along it.
function snapUV(x,y,otherUV,shift){
  guides=[];
  const DEG=Math.PI/180;
  if(otherUV&&shift){
    const o=UV(...otherUV), dx=x-o[0], dy=y-o[1], L=Math.hypot(dx,dy), st=15*DEG, a=Math.round(Math.atan2(dy,dx)/st)*st;
    x=o[0]+L*Math.cos(a); y=o[1]+L*Math.sin(a);
    return XYUV(x,y);
  }
  let [u0,v0]=XYUV(x,y);
  if(!snapOn) return [u0,v0];
  // tolerance: 9 screen px expressed in u and v at this spot
  const d=S._dev, mmU=isCone()?d.phi*Math.hypot(x-d.ax,y-d.ay):S.W, mmV=isCone()?d.L:S.H;
  const tu=9/(view.sc*Math.max(mmU,1e-6)), tv=9/(view.sc*mmV);
  const us=[0.5], vs=[0,0.5,1];
  if(!S.wrap) us.push(0,1);
  if(otherUV){ us.unshift(otherUV[0]); vs.unshift(otherUV[1]); }        // lock along / around against the other end
  S.grads.forEach((g,i)=>{ if(i===drag.i) return; if(g.type==='radial'){us.push(g.u);vs.push(g.v);} else if(g.type==='linear'){us.push(g.au,g.bu);vs.push(g.av,g.bv);} });
  const du=(a,b)=>{ let q=a-b; if(S.wrap) q-=Math.round(q); return Math.abs(q); };
  let su=null, sv=null;
  us.forEach(c=>{ if(du(u0,c)<tu&&(su==null||du(u0,c)<du(u0,su))) su=c; });
  vs.forEach(c=>{ if(Math.abs(v0-c)<tv&&(sv==null||Math.abs(v0-c)<Math.abs(v0-sv))) sv=c; });
  if(su!=null){u0=su; guides.push({u:su});}
  if(sv!=null){v0=sv; guides.push({v:sv});}
  return [u0,v0];
}
function move(X,Y,shift){
  const [x,y]=toModel(X,Y);
  const g=S.grads[drag.i], cl=v=>Math.max(-0.5,Math.min(1.5,v)), wu=v=>S.wrap?((v%1)+1)%1:cl(v);
  if(drag.p==='r'){
    guides=[];
    const c=UV(g.u,g.v); let rad=Math.hypot(x-c[0],y-c[1]); if(snapOn) rad=Math.round(rad);
    g.r=Math.max(2,rad); if(radRef) radRef.sync();
  } else {
    const other=drag.p==='a'?[g.bu,g.bv]:drag.p==='b'?[g.au,g.av]:null;
    const [uu,vv]=snapUV(x,y,other,shift);
    if(drag.p==='c'){g.u=wu(uu); g.v=cl(vv);}
    else if(drag.p==='a'){g.au=S.wrap?uu:cl(uu); g.av=cl(vv);}
    else {g.bu=S.wrap?uu:cl(uu); g.bv=cl(vv);}
  }
  schedule();
}
const snapBtn=$('#snapBtn');
snapBtn.addEventListener('click',()=>{ snapOn=!snapOn; snapBtn.setAttribute('aria-pressed',snapOn); snapBtn.textContent=snapOn?'Snap on':'Snap off'; });

// ---------- 3D preview of the wrapped part ----------
let view3d=false, T3=null, threeLoading=null, spin=true, raf3=0;
const v3=$('#c3d');
function loadThree(){
  if(window.THREE) return Promise.resolve(true);
  if(!threeLoading) threeLoading=new Promise(res=>{
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload=()=>res(!!window.THREE); s.onerror=()=>res(false); document.head.appendChild(s);
  });
  return threeLoading;
}
function init3D(){
  const THREE=window.THREE;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:v3,antialias:true,alpha:true}); }catch(_){ return null; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  if('outputEncoding' in renderer) renderer.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(32,1,1,20000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x3a4250,0.85));
  const key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(1.2,1.6,2); scene.add(key);
  const rim=new THREE.DirectionalLight(0xbfd0ff,0.35); rim.position.set(-2,0.5,-1.5); scene.add(rim);
  const texCanvas=document.createElement('canvas'), tex=new THREE.CanvasTexture(texCanvas);
  tex.wrapS=THREE.RepeatWrapping; tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if('encoding' in tex) tex.encoding=THREE.sRGBEncoding;
  const mat=new THREE.MeshStandardMaterial({map:tex,alphaTest:0.5,side:THREE.DoubleSide,metalness:0.45,roughness:0.42});
  const mesh=new THREE.Mesh(new THREE.BufferGeometry(),mat); mesh.rotation.y=Math.PI; // seam at the back
  scene.add(mesh);
  return {THREE,renderer,scene,camera,tex,texCanvas,mesh,mat,yaw:0.22,pitch:0.3,zoom:1,geoKey:''};
}
function build3D(){
  if(!T3||!S._dev||!RES||RES.error) return;
  const {THREE,mesh,tex,texCanvas}=T3, d=S._dev, inv=S.out==='holes';
  const key=[d.rTop,d.rBot,d.Hax].join('|');
  if(key!==T3.geoKey){
    mesh.geometry.dispose();
    mesh.geometry=new THREE.CylinderGeometry(d.rTop,d.rBot,d.Hax,256,1,true);
    T3.geoKey=key; T3.size=Math.max(d.rTop,d.rBot)*2; T3.h=d.Hax;
  }
  // texture: u across, v up; part surface opaque, holes transparent (or the reverse in holes-only mode)
  const Tw=2048, Th=Math.max(128,Math.min(2048,Math.round(Tw*d.L/d.Cm)));
  texCanvas.width=Tw; texCanvas.height=Th;
  const x=texCanvas.getContext('2d'), sheet=col('--sheet')||'#b8c0c9';
  x.clearRect(0,0,Tw,Th);
  if(!inv){ x.fillStyle=sheet; x.fillRect(0,0,Tw,Th); x.globalCompositeOperation='destination-out'; }
  else x.fillStyle=sheet;
  x.beginPath();
  for(const loop of Core.outlines(RES)){
    loop.forEach((p,k)=>{ const [uu,vv]=Core.xyToUV(S,p[0],p[1]); const X=uu*Tw, Y=(1-vv)*Th; k?x.lineTo(X,Y):x.moveTo(X,Y); });
    x.closePath();
  }
  x.fill('nonzero'); x.globalCompositeOperation='source-over';
  tex.needsUpdate=true;
  T3.mat.color.set(0xffffff);
  draw3D();
}
function draw3D(){
  if(!T3||!view3d) return;
  const {renderer,scene,camera}=T3, r=v3.getBoundingClientRect();
  if(!r.width||!r.height) return;
  renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height;
  const span=Math.max(T3.size||100,T3.h||100), dist=span*1.9*T3.zoom/Math.tan(camera.fov*Math.PI/360)/2;
  camera.position.set(dist*Math.sin(T3.yaw)*Math.cos(T3.pitch), dist*Math.sin(T3.pitch), dist*Math.cos(T3.yaw)*Math.cos(T3.pitch));
  camera.near=dist/50; camera.far=dist*10; camera.lookAt(0,0,0); camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}
function loop3D(){
  raf3=0;
  if(!view3d) return;
  if(spin&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ T3.yaw+=0.004; draw3D(); raf3=requestAnimationFrame(loop3D); }
}
async function setView(on){
  view3d=on;

  v3.hidden=!on; cv.hidden=on; $('#snapBtn').hidden=on;

  $('#chip').textContent='Loading 3D…';

  $('#chip').textContent='Drag to orbit · scroll to zoom · seam is at the back';

}

let orbit=null;
v3.addEventListener('pointerdown',e=>{ orbit={x:e.clientX,y:e.clientY,yaw:T3?T3.yaw:0,pitch:T3?T3.pitch:0}; spin=false; v3.setPointerCapture(e.pointerId); });
v3.addEventListener('pointermove',e=>{ if(!orbit||!T3) return; T3.yaw=orbit.yaw-(e.clientX-orbit.x)*0.008; T3.pitch=Math.max(-1.3,Math.min(1.3,orbit.pitch+(e.clientY-orbit.y)*0.008)); draw3D(); });

      case 'save-as': await saveDesign(true); break;
      case 'save-and-close': if(await saveDesign(false)) APP.savedAndClose(); break;
      case 'open': { if(!(await okToReplace())) break; const f=await APP.open(); if(f.canceled) break; if(f.error){ toast(f.error); break; } loadDesign(f); break; }
      case 'load': if(await okToReplace()) loadDesign(p); break;
      case 'new': {
        if(!(await okToReplace())) break;
        S=clone(Object.assign({},DEF,PRESETS[0].s)); active=0; dismissed.clear(); Core.normalize(S); resetHistory();
        modeUI(); renderGrad(); syncControls(); schedule(); presetSel.value='0';
        docPath=null; docName=null; savedStr=snapStr(); updDoc(); if(view3d) setView(false);
        break;
      }
      case 'export-dxf': $('#bDXF').click(); break;
      case 'export-svg': $('#bSVG').click(); break;
      case 'copy-dxf': $('#bCopy').click(); break;
      case 'view-flat': if(view3d) setView(false); break;
      case 'view-3d': if(S.wrap) setView(true); else toast('Turn on “Wrap around a cylinder” to see the part in 3D.'); break;
      case 'mode-plate': setMode('plate'); break;
      case 'mode-holes': setMode('holes'); break;
      case 'snap': snapBtn.click(); toast(snapOn?'Snapping on.':'Snapping off.'); break;
      case 'error': toast(String(p)); break;
    }
  });
}

// ---------- boot ----------
buildControls(); buildPresets(); Core.normalize(S); setBaseline(); commit(); renderGrad(); syncControls(); run();
$('#bUndo').addEventListener('click',undo); $('#bRedo').addEventListener('click',redo);
if(APP){ savedStr=snapStr(); updDoc(); APP.ready(); }
let inputTimer=0;
$('#side').addEventListener('change',()=>{ clearTimeout(inputTimer); commit(); });
$('#side').addEventListener('input',()=>{ clearTimeout(inputTimer); inputTimer=setTimeout(commit,700); });
document.addEventListener('keydown',e=>{
  if(APP||!(e.metaKey||e.ctrlKey)) return; // in the Mac app the Edit menu handles these
  const t=e.target, k=e.key.toLowerCase();
  if(t&&t.tagName==='INPUT'&&t.type==='number') return; // let the field undo its own typing
  if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); redo(); }
});
new ResizeObserver(()=>{ draw(); draw3D(); }).observe($('#cwrap'));
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw); }catch(_){}
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
