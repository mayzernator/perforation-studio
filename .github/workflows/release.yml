name: Build Mac app
on:
  push:
    branches: [main]
  workflow_dispatch:
# read-only by default; only the build job may publish the release
permissions:
  contents: read
# never let two builds race to replace the "latest" release
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      # actions pinned to exact commits so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && (cd fonts-src && npm ci) && npm run dist
        working-directory: perf-app
      # one rolling "latest" release, replaced on every push to main
      - run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest perf-app/dist/*.zip --target "$GITHUB_SHA" --title "Latest build" --notes "Built from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
