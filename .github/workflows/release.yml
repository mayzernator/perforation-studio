name: Build Mac app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && (cd fonts-src && npm ci) && npm run dist
        working-directory: perf-app
      # one rolling "latest" release, replaced on every push to main
      - run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest perf-app/dist/*.zip --title "Latest build" --notes "Built from ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
